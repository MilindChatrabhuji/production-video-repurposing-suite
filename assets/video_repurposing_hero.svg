<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#18182E"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Background Grid Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Main Card (Vertical Phone Shorts Preview Mockup) -->
  <g transform="translate(100, 75)" filter="url(#cardShadow)">
    <!-- Smartphone Bezel (9:16 aspect ratio mockup) -->
    <rect width="270" height="480" rx="32" fill="#000000" stroke="#334155" stroke-width="4"/>
    <rect x="8" y="8" width="254" height="464" rx="26" fill="#1E1B4B"/>
    <!-- Camera Notch -->
    <rect x="95" y="14" width="80" height="18" rx="9" fill="#000000"/>

    <!-- Video Preview Area -->
    <rect x="14" y="40" width="242" height="424" rx="20" fill="#0F172A"/>
    <!-- Mockup Speaker Video Frame -->
    <circle cx="135" cy="180" r="50" fill="#312E81"/>
    <path d="M 105 240 Q 135 210 165 240 Z" fill="#4338CA"/>

    <!-- Top Badge -->
    <rect x="25" y="55" width="95" height="20" rx="10" fill="rgba(244, 63, 94, 0.25)" stroke="#F43F5E"/>
    <text x="35" y="69" fill="#F43F5E" font-size="10" font-family="-apple-system, sans-serif" font-weight="800">&#9658; 30s HOOK</text>

    <!-- Animated Karaoke Captions Mockup -->
    <g transform="translate(25, 290)">
      <rect width="220" height="75" rx="8" fill="rgba(0,0,0,0.65)"/>
      <text x="12" y="30" fill="#FFFFFF" font-size="14" font-weight="900" font-family="-apple-system, sans-serif">
        DID YOU <tspan fill="#FACC15">KNOW</tspan> SGLT2i
      </text>
      <text x="12" y="55" fill="#FFFFFF" font-size="14" font-weight="900" font-family="-apple-system, sans-serif">
        CUTS RISK BY <tspan fill="#FACC15">24%</tspan>?
      </text>
    </g>

    <!-- Platform Interaction Buttons Mockup (Right Rail) -->
    <circle cx="230" cy="270" r="14" fill="rgba(255,255,255,0.2)"/>
    <text x="226" y="275" fill="#FFFFFF" font-size="13">&#9829;</text>
    <circle cx="230" cy="310" r="14" fill="rgba(255,255,255,0.2)"/>
    <text x="225" y="315" fill="#FFFFFF" font-size="12">&#128172;</text>
    <circle cx="230" cy="350" r="14" fill="rgba(255,255,255,0.2)"/>
    <text x="225" y="355" fill="#FFFFFF" font-size="12">&#10148;</text>

    <!-- Safe Zone Guard Indicator -->
    <rect x="20" y="390" width="230" height="30" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-dasharray="3"/>
    <text x="30" y="410" fill="#34D399" font-size="9" font-family="-apple-system, sans-serif" font-weight="700">&#10003; Safe Zone Protected (280px Margin)</text>
  </g>

  <!-- Middle Repurposing Process Diagram -->
  <g transform="translate(400, 110)">
    <!-- Master Video Node -->
    <rect x="0" y="0" width="180" height="85" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="16" y="30" fill="#94A3B8" font-size="11" font-weight="700" font-family="-apple-system, sans-serif">MASTER VIDEO</text>
    <text x="16" y="52" fill="#FFFFFF" font-size="14" font-weight="800" font-family="-apple-system, sans-serif">60m 16:9 Lecture</text>
    <text x="16" y="70" fill="#38BDF8" font-size="11" font-family="-apple-system, sans-serif">1080p Horizontal</text>

    <!-- Arrow Down -->
    <path d="M 90 95 L 90 135" stroke="#F43F5E" stroke-width="3" stroke-dasharray="4"/>
    <polygon points="85,135 90,145 95,135" fill="#F43F5E"/>

    <!-- Automated Cutting Engine -->
    <rect x="0" y="150" width="180" height="85" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="16" y="180" fill="#F43F5E" font-size="11" font-weight="700" font-family="-apple-system, sans-serif">REPURPOSING ENGINE</text>
    <text x="16" y="202" fill="#FFFFFF" font-size="14" font-weight="800" font-family="-apple-system, sans-serif">Hook &amp; Cut Pipeline</text>
    <text x="16" y="220" fill="#FACC15" font-size="11" font-family="-apple-system, sans-serif">Karaoke .ASS Captions</text>

    <!-- Arrow Down -->
    <path d="M 90 245 L 90 285" stroke="#F43F5E" stroke-width="3" stroke-dasharray="4"/>
    <polygon points="85,285 90,295 95,285" fill="#F43F5E"/>

    <!-- Output Shorts -->
    <rect x="0" y="300" width="180" height="85" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="16" y="330" fill="#10B981" font-size="11" font-weight="700" font-family="-apple-system, sans-serif">MULTI-PLATFORM</text>
    <text x="16" y="352" fill="#FFFFFF" font-size="14" font-weight="800" font-family="-apple-system, sans-serif">20 Viral Shorts</text>
    <text x="16" y="370" fill="#A855F7" font-size="11" font-family="-apple-system, sans-serif">TikTok &#8226; Reels &#8226; Shorts</text>
  </g>

  <!-- Right Typography & Product Badges -->
  <g transform="translate(630, 95)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="rgba(244, 63, 94, 0.15)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="20" y="22" fill="#FB7185" font-size="13" font-family="-apple-system, sans-serif" font-weight="700" letter-spacing="1">WAY #54 &#8226; PRODUCT #56</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-size="40" font-family="-apple-system, sans-serif" font-weight="900" letter-spacing="-1">Production Video</text>
    <text x="0" y="130" fill="url(#accentGrad)" font-size="40" font-family="-apple-system, sans-serif" font-weight="900" letter-spacing="-1">Repurposing Suite</text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="180" fill="#CBD5E1" font-size="16" font-family="-apple-system, sans-serif" font-weight="500">
      <tspan x="0" dy="0">Long-form video segmenter, animated karaoke subtitles,</tspan>
      <tspan x="0" dy="24">vertical 9:16 Shorts cropping &amp; multi-platform syndication.</tspan>
    </text>

    <!-- Feature Grid -->
    <g transform="translate(0, 230)">
      <!-- Feature 1 -->
      <circle cx="12" cy="12" r="10" fill="#F43F5E"/>
      <path d="M 8 12 L 11 15 L 16 9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="32" y="16" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif" font-weight="600">Viral Hook Scoring &amp; Duration Splitter (15s–90s)</text>

      <!-- Feature 2 -->
      <circle cx="12" cy="46" r="10" fill="#F43F5E"/>
      <path d="M 8 46 L 11 49 L 16 43" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="32" y="50" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif" font-weight="600">Animated Word-by-Word Karaoke Subtitles (.ASS)</text>

      <!-- Feature 3 -->
      <circle cx="12" cy="80" r="10" fill="#F43F5E"/>
      <path d="M 8 80 L 11 83 L 16 77" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="32" y="84" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif" font-weight="600">FFmpeg 9:16 Re-Framing &amp; Safe-Zone Bounding</text>

      <!-- Feature 4 -->
      <circle cx="12" cy="114" r="10" fill="#F43F5E"/>
      <path d="M 8 114 L 11 117 L 16 111" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="32" y="118" fill="#E2E8F0" font-size="14" font-family="-apple-system, sans-serif" font-weight="600">B2B Retainer Kit ($500 - $3,000/mo Tiers)</text>
    </g>

    <!-- Commercials Bar -->
    <g transform="translate(0, 385)">
      <rect x="0" y="0" width="500" height="52" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#334155"/>
      <text x="18" y="32" fill="#38BDF8" font-size="16" font-family="-apple-system, sans-serif" font-weight="800">$9 Single / $19 Master Suite</text>
      <text x="270" y="32" fill="#10B981" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">&#8226; $500 - $3,000 Retainers</text>
    </g>
  </g>
</svg>